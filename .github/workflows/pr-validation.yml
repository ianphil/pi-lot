name: pi-lot PR validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore pi-lot.sln

      - name: Verify solution project coverage
        shell: bash
        run: |
          expected="$(mktemp)"
          actual="$(mktemp)"

          find src tests -name '*.csproj' | sort > "$expected"
          dotnet sln pi-lot.sln list \
            | awk 'NR > 2 { gsub("\\\\", "/"); print }' \
            | sort > "$actual"

          diff -u "$expected" "$actual"

      - name: Build solution
        run: dotnet build pi-lot.sln --configuration Release --no-restore --disable-build-servers -m:1 --no-incremental

      - name: Run tests
        run: dotnet test pi-lot.sln --configuration Release --no-build --filter "Category!=Smoke&Category!=UpstreamCapture"
